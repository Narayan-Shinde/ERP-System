# ═══════════════════════════════════════════════════════════
# SERVER
# ═══════════════════════════════════════════════════════════
server.port=8080

# ═══════════════════════════════════════════════════════════
# MONGODB — PERMANENT FIX
# Auto-reconnect enabled, retry writes, connection pool
# ═══════════════════════════════════════════════════════════
spring.data.mongodb.uri=mongodb://localhost:27017/erp_accounting_db?connectTimeoutMS=30000&socketTimeoutMS=30000&serverSelectionTimeoutMS=30000&retryWrites=true&retryReads=true
spring.data.mongodb.database=erp_accounting_db

# MongoDB auto-reconnect on restart — CRITICAL for long-running production
spring.data.mongodb.auto-index-creation=false

# ═══════════════════════════════════════════════════════════
# JWT — 50 YEARS SATHI FIX
# 86400000 = 1 din (24 hours)
# 2592000000 = 30 din
# 31536000000 = 365 din (1 year)
# 1576800000000 = 50 years ← CLIENT SATHI
# ═══════════════════════════════════════════════════════════
app.jwt.secret=ERPAccountingGSTSystemSecretKeyFor50YearsProductionDeploymentVeryLongSecure2024Key
app.jwt.expiration=1576800000000

# ═══════════════════════════════════════════════════════════
# CORS
# ═══════════════════════════════════════════════════════════
app.cors.allowed-origins=http://localhost:3000

# ═══════════════════════════════════════════════════════════
# LOGGING — Production madhe DEBUG nako, INFO enough
# ═══════════════════════════════════════════════════════════
logging.level.com.erp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=WARN

# ═══════════════════════════════════════════════════════════
# FILE UPLOAD
# ═══════════════════════════════════════════════════════════
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ═══════════════════════════════════════════════════════════
# JACKSON
# ═══════════════════════════════════════════════════════════
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ═══════════════════════════════════════════════════════════
# ERROR HANDLING
# ═══════════════════════════════════════════════════════════
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ═══════════════════════════════════════════════════════════
# SERVER RESTART HARDENING
# ═══════════════════════════════════════════════════════════
server.tomcat.connection-timeout=60000
server.tomcat.keep-alive-timeout=60000

