# =====================================================
# SERVER CONFIGURATION
# =====================================================
server.port=8080
server.servlet.context-path=/
server.tomcat.connection-timeout=60000
server.tomcat.keep-alive-timeout=60000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# =====================================================
# MONGODB 6.0 CONFIGURATION (JDK 17 Compatible)
# =====================================================
spring.data.mongodb.uri=mongodb+srv://shindenarayan572003_db_user:Narayan%40572003%26Rohit45@cluster0.qek62cg.mongodb.net/narayan_erp
spring.data.mongodb.auto-index-creation=false
# =====================================================
# JWT — access token (login response). Override JWT_SECRET in production (32+ bytes).
# app.jwt.expiration = milliseconds (default 8h). Shorter = more secure; users re-login when expired.
# =====================================================
app.jwt.secret=${JWT_SECRET:ERPAccountingDevSecretKey2026TestOnly1234567890ABCDEFGHIJK}
app.jwt.expiration=${JWT_EXPIRATION_MS:28800000}
app.jwt.access.expiration=${JWT_ACCESS_EXPIRATION_MS:28800000}
app.jwt.refresh.expiration=2592000000
app.jwt.issuer=erp-accounting-system
app.jwt.audience=erp-users

# Refresh Token MongoDB Collection
spring.data.mongodb.collections.refresh_tokens=refresh_tokens

# =====================================================
# SECURITY CONFIGURATION
# =====================================================
app.security.refresh-token.fingerprint.enabled=true
app.security.refresh-token.rotation.enabled=true
app.security.refresh-token.max-per-user=5
app.rate-limit.enabled=true
app.rate-limit.requests-per-minute=100

# =====================================================
# CORS CONFIGURATION - React Frontend
# =====================================================
app.cors.allowed-origins=http://localhost:3000,https://yourdomain.com
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Origin
app.cors.allow-credentials=true
app.cors.max-age=3600

# =====================================================
# LOGGING CONFIGURATION - Cross Platform
# =====================================================
logging.level.root=WARN
logging.level.com.erp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot.autoconfigure=WARN

# Windows Development (Create ./logs folder)
logging.file.name=./logs/erp-accounting.log

# Linux/Docker Production (mkdir -p /var/log/erp)
# logging.file.name=/var/log/erp/erp-accounting.log

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# =====================================================
# FILE UPLOAD - GST Documents/Invoices
# =====================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2MB

# =====================================================
# JACKSON JSON CONFIGURATION
# =====================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-null-map-values=false
spring.jackson.generator.escape-non-ascii=false

# =====================================================
# WEB MVC CONFIGURATION
# =====================================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.mvc.async.request-timeout=30000
spring.mvc.cache.static-contents.cache-period=3600
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# =====================================================
# ACTUATOR - Production Minimal
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=false
management.endpoint.info.enabled=true
management.health.mongo.enabled=true

# =====================================================
# PERFORMANCE OPTIMIZATION
# =====================================================
server.tomcat.accept-count=1000
server.tomcat.max-connections=10000

# =====================================================
# GST ERP BUSINESS CONFIGURATION
# =====================================================
app.gst.return-filing.enabled=true
app.gst.e-invoicing.enabled=false
app.gst.e-waybill.enabled=true
app.company.name=${COMPANY_NAME:Your Company Name}
app.company.gst-number=${GST_NUMBER:27ABCDE1234F1Z5}
app.company.pan-number=${PAN_NUMBER:ABCDE1234F}

